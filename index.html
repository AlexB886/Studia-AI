<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studia-IA · Tu espacio de estudio</title>
  <meta name="description" content="Studia-IA: organiza tus asignaturas, planifica tu estudio y mantén la racha." />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/views.css" />
</head>
<body>
  <!-- ===== Sprite de iconos (SVG inline, sin dependencias externas) ===== -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><path d="M10 3h4"/><path d="M12 6a7 7 0 1 1-4.2 12.6"/><path d="M12 10v3.5l2.5 1.5"/></symbol>

    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.6a3.2 3.2 0 0 1 0 6.3"/><path d="M17 14.2A5.5 5.5 0 0 1 21 19"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l3.5 3L12 5l5.5 6L21 8l-1.5 11h-15z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9"/><path d="M10 18a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5"/></symbol>

    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7.3l2.5-2.5a4 4 0 1 0-5.7-5.7L11.2 6.9"/><path d="M14 10.5a4 4 0 0 0-5.7-.3l-2.5 2.5a4 4 0 1 0 5.7 5.7l1.3-1.3"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3s5 4 5 8.5a5 5 0 0 1-10 0C7 9 9 7 9 7s.5 2 1.5 2S12 3 12 3"/><path d="M12 21a5 5 0 0 0 5-5c0-1.2-.6-2.4-1.5-3.4-.6 1-1.6 1.4-2.3 1.4-1 0-1.6-.8-1.4-2.1-1.4 1-2.3 2.4-2.3 4.1a5 5 0 0 0 5 5"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 5"/><path d="M17 6h2.5a2.5 2.5 0 0 1-2.5 5"/><path d="M12 14v3M9 20h6M10 17h4l.5 3h-5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>

  <div class="app" id="app">
    <!-- ===== Barra lateral ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand__mark" aria-hidden="true">S<span class="brand__dot">.</span></div>
        <div class="brand__text">
          <strong>Studia<span>-IA</span></strong>
          <small id="brandPlan">Plan gratuito</small>
        </div>
        <button class="icon-btn sidebar__close" id="btnCloseSidebar" aria-label="Cerrar menú">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </div>

      <nav class="nav" id="nav" aria-label="Navegación principal">
        <p class="nav__label">Planificación</p>
        <a class="nav__item" href="#/dashboard" data-nav="dashboard">
          <svg class="icon"><use href="#i-home"></use></svg><span>Panel</span>
        </a>
        <a class="nav__item" href="#/calendar" data-nav="calendar">
          <svg class="icon"><use href="#i-calendar"></use></svg><span>Calendario</span>
          <em class="nav__badge" id="navBadgeCalendar">0</em>
        </a>
        <a class="nav__item" href="#/schedule" data-nav="schedule">
          <svg class="icon"><use href="#i-clock"></use></svg><span>Horario</span>
        </a>
        <a class="nav__item" href="#/study" data-nav="study">
          <svg class="icon"><use href="#i-timer"></use></svg><span>Estudio</span>
        </a>
        <a class="nav__item" href="#/progress" data-nav="progress">
          <svg class="icon"><use href="#i-chart"></use></svg><span>Progresión</span>
        </a>

        <p class="nav__label">Academia</p>
        <a class="nav__item" href="#/subjects" data-nav="subjects">
          <svg class="icon"><use href="#i-book"></use></svg><span>Asignaturas</span>
        </a>
        <a class="nav__item" href="#/tasks" data-nav="tasks">
          <svg class="icon"><use href="#i-check"></use></svg><span>Tareas</span>
          <em class="nav__badge" id="navBadgeTasks">0</em>
        </a>
        <a class="nav__item" href="#/ai" data-nav="ai">
          <svg class="icon"><use href="#i-robot"></use></svg><span>Luna (IA)</span>
        </a>

        <p class="nav__label">Comunidad</p>
        <a class="nav__item" href="#/social" data-nav="social">
          <svg class="icon"><use href="#i-users"></use></svg><span>Social</span>
        </a>
        <a class="nav__item" href="#/premium" data-nav="premium">
          <svg class="icon"><use href="#i-crown"></use></svg><span>Premium</span>
        </a>
      </nav>

      <div class="sidebar__streak" id="sidebarStreak">
        <div class="streak-mini__icon"><svg class="icon"><use href="#i-fire"></use></svg></div>
        <div class="streak-mini__text">
          <strong id="streakMiniValue">0 días</strong>
          <small>Mejor racha: <span id="streakMiniBest">0</span></small>
        </div>
      </div>

      <div class="sidebar__foot">
        <button class="nav__item nav__item--btn" id="btnSettings">
          <svg class="icon"><use href="#i-settings"></use></svg><span>Ajustes</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- ===== Cuerpo ===== -->
    <div class="app__body">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="btnOpenSidebar" aria-label="Abrir menú">
          <svg class="icon"><use href="#i-menu"></use></svg>
        </button>

        <div class="topbar__title">
          <h1 id="viewTitle">Panel</h1>
          <p id="viewSubtitle">Tu resumen de estudio de hoy</p>
        </div>

        <div class="topbar__search">
          <svg class="icon"><use href="#i-search"></use></svg>
          <input type="search" id="globalSearch" placeholder="Buscar asignatura, tarea, apuntes…" autocomplete="off" />
          <div class="search-results" id="searchResults" hidden></div>
        </div>

        <div class="topbar__actions">
          <div class="chip chip--streak" id="topStreak" title="Tu racha de estudio">
            <svg class="icon"><use href="#i-fire"></use></svg><span id="topStreakValue">0</span>
          </div>
          <button class="icon-btn" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema">
            <svg class="icon icon--sun"><use href="#i-sun"></use></svg>
            <svg class="icon icon--moon"><use href="#i-moon"></use></svg>
          </button>
          <div class="popover-wrap">
            <button class="icon-btn" id="btnBell" title="Recordatorios" aria-label="Recordatorios">
              <svg class="icon"><use href="#i-bell"></use></svg>
              <span class="dot-alert" id="bellDot" hidden></span>
            </button>
            <div class="popover" id="bellPopover" hidden></div>
          </div>
          <button class="avatar" id="btnProfile" title="Tu perfil">
            <span id="avatarInitials">ES</span>
          </button>
        </div>
      </header>

      <main class="app__main" id="appMain" tabindex="-1"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- ===== Núcleo ===== -->
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/core/db.js"></script>
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/core/router.js"></script>
  <!-- ===== Datos ===== -->
  <script src="assets/js/data/holidays.js"></script>
  <script src="assets/js/data/rewards.js"></script>
  <script src="assets/js/data/seed.js"></script>
  <!-- ===== Módulos ===== -->
  <script src="assets/js/modules/dashboard.js"></script>
  <script src="assets/js/modules/calendar.js"></script>
  <script src="assets/js/modules/schedule.js"></script>
  <script src="assets/js/modules/study.js"></script>
  <script src="assets/js/modules/progress.js"></script>
  <script src="assets/js/modules/subjects.js"></script>
  <script src="assets/js/modules/tasks.js"></script>
  <script src="assets/js/modules/ai.js"></script>
  <script src="assets/js/modules/social.js"></script>
  <script src="assets/js/modules/premium.js"></script>
  <!-- ===== Arranque ===== -->
  <script src="assets/js/main.js"></script>
</body>
</html>
