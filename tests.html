<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tests · Studia-IA</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css?v=0.3.1" />
  <style>
    body { padding: 32px 20px; }
    .tests { max-width: 820px; margin: 0 auto; }
    .tests h1 { margin: 0 0 4px; }
    .summary { margin: 18px 0; padding: 14px 18px; border-radius: 12px; font-weight: 700; }
    .summary--ok { background: #dcfce7; color: #166534; }
    .summary--fail { background: #fee2e2; color: #991b1b; }
    #results { display: grid; gap: 6px; }
    .test { padding: 9px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
    .test--ok { border-left: 4px solid #16a34a; }
    .test--fail { border-left: 4px solid #dc2626; color: #991b1b; }
  </style>
</head>
<body>
  <main class="tests">
    <h1>Tests de Studia-IA</h1>
    <p class="soft">Comprobaciones del núcleo. Tus datos se copian y se restauran al terminar.</p>
    <p id="summary" class="summary">Ejecutando…</p>
    <div id="results"></div>
    <p class="tiny soft" style="margin-top:18px">Si abres esto desde <code>file://</code> y el navegador bloquea el storage, prueba con el servidor local.</p>
  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="assets/js/modules/calendar.js?v=0.3.1"></script>
